<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no
        "
    />
    <title>sudoku-variant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
<div id="app">
    <div id="board">
        <div id="board-inner">
            <div id="grid">
                <div id="main-grid"></div>
                <svg id="memo-color" viewBox="0 0 9 9" preserveAspectRatio="none" opacity="0.5">
                    <defs>
                        <clipPath id="cell-clip">
                            <rect x="0" y="0" width="1" height="1" />
                        </clipPath>
                    </defs>
                </svg>
                <svg id="layer-top" class="overlay" viewBox="-4.5 -4.5 18 18" preserveAspectRatio="none">
                    <g id="layer-top-bridge"></g>
                    <g id="layer-top-prism"></g>
                    <g id="layer-top-link"></g>
                    <g id="layer-top-point"></g>
                </svg>
                <svg id="layer-middle" class="overlay" viewBox="-4.5 -4.5 18 18" preserveAspectRatio="none"></svg>
                <svg id="layer-bottom" class="overlay" viewBox="-4.5 -4.5 18 18" preserveAspectRatio="none"></svg>
            </div>
            <div id="left-clues" class="row-clues"></div>
            <div id="right-clues" class="row-clues"></div>
            <div id="top-clues" class="column-clues"></div>
            <div id="bottom-clues" class="column-clues"></div>
        </div>
    </div>
    <div id="controls">
        <div id="digit-pad">
            <button id="button-1" class="button-digit"><span>1</span></button>
            <button id="button-2" class="button-digit"><span>2</span></button>
            <button id="button-3" class="button-digit"><span>3</span></button>
            <button id="button-normal" class="selected-mode">Normal</button>

            <button id="button-4" class="button-digit"><span>4</span></button>
            <button id="button-5" class="button-digit"><span>5</span></button>
            <button id="button-6" class="button-digit"><span>6</span></button>
            <button id="button-corner">Corner</button>

            <button id="button-7" class="button-digit"><span>7</span></button>
            <button id="button-8" class="button-digit"><span>8</span></button>
            <button id="button-9" class="button-digit"><span>9</span></button>
            <button id="button-center">Center</button>

            <button id="button-0" class="button-digit"><span>0</span></button>
            <button id="button-alphabet">(Temp)</button>
            <button id="button-delete">Delete</button>
            <button id="button-color">Color</button>
        </div>
        <div id="empty-space"></div>
        <div id="utility-pad">
            <button id="button-open-info">Puzzle<br/>Info</button>
            <button id="button-load-text">Load<br/>Puzzle</button>
            <button id="button-copy-board">Copy<br/>Board</button>
            <button id="button-undo">Undo</button>
            <button id="button-redo">Redo</button>
        </div>
    </div>
    <div id="info-modal" class="modal">
        <div id="info-backdrop"></div>

        <div id="info-content">
            <div id="info-text"></div>
            <a href="https://discord.gg/E2hwVqQ3PC" target="_blank" style="align-self: center">Join Pillow's Sudoku Variants Discord Server!</a>
            <br />
            <button id="button-close-info">close</button>
        </div>
    </div>
</div>
<script type="module" src="/src/main.ts"></script>
<script type="module" src="/src/layout.ts"></script>
</body>
</html>
