<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>sudoku-variant</title>
</head>
<body>
<div id="app">
    <div id="board">
        <div id="board-inner">
            <div id="grid">
                <div id="main-grid"></div>
                <svg id="memo-color" viewBox="0 0 9 9" preserveAspectRatio="none">
                    <defs>
                        <clipPath id="cell-clip">
                            <rect x="0" y="0" width="1" height="1" />
                        </clipPath>
                    </defs>
                </svg>
                <svg id="layer-top" class="overlay" viewBox="-0.5 -0.5 18 18" preserveAspectRatio="none">
                    <g id="layer-top-prism"></g>
                    <g id="layer-top-link"></g>
                    <g id="layer-top-point"></g>
                </svg>
                <svg id="layer-middle" class="overlay" viewBox="-0.5 -0.5 18 18" preserveAspectRatio="none"></svg>
                <svg id="layer-bottom" class="overlay" viewBox="-0.5 -0.5 18 18" preserveAspectRatio="none"></svg>
            </div>
            <div id="right-clues"></div>
            <div id="bottom-clues"></div>
        </div>
    </div>
    <div id="controls">
        <div class="digit-pad">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>Normal</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>Corner</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>Center</button>

            <button>0</button>
            <button>1/A</button>
            <button>Delete</button>
            <button>Color</button>
        </div>

<!--        <div class="utility-pad">-->
<!--            <button>Undo</button>-->
<!--            <button>Redo</button>-->
<!--            <button>Delete</button>-->
<!--        </div>-->
    </div>
</div>
<script type="module" src="/src/main.ts"></script>
<script type="module" src="/src/layout.ts"></script>
</body>
</html>
