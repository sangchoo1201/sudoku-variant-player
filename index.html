<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>sudoku-variant</title>
</head>
<body>
<div id="app">
    <div id="board">
        <div id="board-inner">
            <div id="grid">
                <div id="main-grid"></div>
                <svg id="memo-color" viewBox="0 0 9 9" preserveAspectRatio="none">
                    <defs>
                        <clipPath id="cell-clip">
                            <rect x="0" y="0" width="1" height="1" />
                        </clipPath>
                    </defs>
                </svg>
                <svg id="layer-top" class="overlay" viewBox="-0.5 -0.5 18 18" preserveAspectRatio="none">
                    <g id="layer-top-prism"></g>
                    <g id="layer-top-link"></g>
                    <g id="layer-top-point"></g>
                </svg>
                <svg id="layer-middle" class="overlay" viewBox="-0.5 -0.5 18 18" preserveAspectRatio="none"></svg>
                <svg id="layer-bottom" class="overlay" viewBox="-0.5 -0.5 18 18" preserveAspectRatio="none"></svg>
            </div>
            <div id="right-clues"></div>
            <div id="bottom-clues"></div>
        </div>
    </div>
    <div id="controls">
        <div id="digit-pad">
            <button id="button-1" class="button-digit">1</button>
            <button id="button-2" class="button-digit">2</button>
            <button id="button-3" class="button-digit">3</button>
            <button id="button-normal" class="selected-mode">Normal</button>

            <button id="button-4" class="button-digit">4</button>
            <button id="button-5" class="button-digit">5</button>
            <button id="button-6" class="button-digit">6</button>
            <button id="button-corner">Corner</button>

            <button id="button-7" class="button-digit">7</button>
            <button id="button-8" class="button-digit">8</button>
            <button id="button-9" class="button-digit">9</button>
            <button id="button-center">Center</button>

            <button id="button-0" class="button-digit">0</button>
            <button id="button-alphabet">(Temp)</button>
            <button id="button-delete">Delete</button>
            <button id="button-color">Color</button>
        </div>

<!--        <div class="utility-pad">-->
        <div id="empty-space"></div>
        <div id="utility-pad">
<!--            <button>Undo</button>-->
<!--            <button>Redo</button>-->
<!--            <button>Delete</button>-->
<!--        </div>-->
        </div>
    </div>
</div>
<script type="module" src="/src/main.ts"></script>
<script type="module" src="/src/layout.ts"></script>
</body>
</html>
